# Thông tin tài khoản Yodobashi
account:
  username: "your_email@example.com"
  password: "your_password"

# Sản phẩm cần mua (1 sản phẩm = 1 instance)
# Để mua nhiều sản phẩm: chạy nhiều instance với config riêng
#   python main.py --config config-product1.yaml
#   python main.py --config config-product2.yaml
product:
  name: "Product Name Here"
  url: "https://www.yodobashi.com/product/XXXXXXXXXX"
  quantity: 1
  mode: "listening"           # scheduled | listening
  check_interval: 60          # Check mỗi N giây
  # Chỉ dùng cho mode=scheduled:
  # start_time: "09:25"       # Bắt đầu check
  # sale_time: "09:30"        # Giờ mở bán
  # max_per_day: 5            # Giới hạn/ngày (0 = unlimited)
  # Chỉ dùng cho mode=listening:
  max_per_month: 1            # Giới hạn/tháng (0 = unlimited)

# Thông tin thẻ thanh toán
payment:
  card_number: "1234567890123456"
  expiry_month: "01"
  expiry_year: "2030"
  cvv: "123"
  card_holder_name: "YOUR NAME"

# Địa chỉ giao hàng
shipping:
  full_name: "YOUR NAME"
  postal_code: "100-0001"
  prefecture: "東京都"
  city: "千代田区"
  address_line1: "1-1-1"
  address_line2: ""
  phone: "090-0000-0000"

# Cài đặt chung
settings:
  max_retries: 3
  dry_run: true               # true = dừng trước bước confirm, không mua thật
  headless: true              # true = không hiện browser
  timeout: 30
  screenshot_on_error: true
  require_confirmation: false

# Lưu ý: Nếu mua thất bại, cart sẽ được xóa sạch trước khi retry
